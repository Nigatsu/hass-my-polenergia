[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.my_polenergia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
follow_imports = "silent"
ignore_missing_imports = true
# The vendored client is HA-free and fully annotated, so it is checked strictly;
# the HA-facing modules rely on untyped helpers and are checked at a lower bar.
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = "(^|/)(tests|venv|local-docker|dev)/"

[[tool.mypy.overrides]]
module = "custom_components.my_polenergia.polenergia.*"
disallow_any_generics = true
warn_return_any = true
